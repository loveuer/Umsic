name: Release Android APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          TAG=${GITHUB_REF_NAME}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/Umsic-${TAG}-arm64.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/Umsic-${TAG}-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
             build/app/outputs/flutter-apk/Umsic-${TAG}-x64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Umsic ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/app/outputs/flutter-apk/Umsic-${{ github.ref_name }}-arm64.apk
            build/app/outputs/flutter-apk/Umsic-${{ github.ref_name }}-v7a.apk
            build/app/outputs/flutter-apk/Umsic-${{ github.ref_name }}-x64.apk
          generate_release_notes: true
